name: Build APK

on:
  push:
    branches: [dual-screen]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # AGP 7.0.x builds with JDK 11; the runner's sdkmanager needs JDK 17.
      # The last version listed becomes the default JAVA_HOME.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            11
            17

      # AGP 7.0.3's default NDK; newer NDKs drop APP_PLATFORM=android-16
      - name: Install SDK and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-31" "build-tools;30.0.2" "ndk;21.4.7075529"

      - name: Build debug APK
        run: |
          export JAVA_HOME="$JAVA_HOME_11_X64"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: zelda3-rgds-debug
          path: app/build/outputs/apk/debug/*.apk

      # Also publish as a release so the APK can be downloaded directly
      # (no zip, no login) from the repo's Releases page.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rgds-build-${{ github.run_number }}
          name: RG DS build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
