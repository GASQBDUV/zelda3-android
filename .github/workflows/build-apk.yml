name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 7.0.x needs JDK 11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: android-actions/setup-android@v3

      # AGP 7.0.3's default NDK; newer NDKs drop APP_PLATFORM=android-16
      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-31" "build-tools;30.0.2" "ndk;21.4.7075529"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: zelda3-rgds-debug
          path: app/build/outputs/apk/debug/*.apk

      # Also publish as a release so the APK can be downloaded directly
      # (no zip, no login) from the repo's Releases page.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rgds-build-${{ github.run_number }}
          name: RG DS build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
